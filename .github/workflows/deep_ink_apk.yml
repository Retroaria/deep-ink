name: Deep Ink APK

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'deepink/branding/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint (Deep Ink files)
    runs-on: ubuntu-26.04
    container:
      image: koreader/kobase:3.0.0-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
      - name: Luacheck
        run: luacheck frontend/deepink plugins/deepink.koplugin frontend/ui/elements/reader_menu_order.lua frontend/ui/elements/filemanager_menu_order.lua

  build:
    name: Build
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      jobs: android-arm android-arm64
      artifacts: true

  release:
    name: Publish APKs
    needs: build
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            .github
            deepink
      - name: Download APKs
        uses: ./.github/actions/download-artifacts
        with:
          path: assets
          regex: '^deep-ink-.*\.apk$'
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          cp assets/deep-ink-android-arm-*.apk deep-ink-arm.apk
          cp assets/deep-ink-android-arm64-*.apk deep-ink-arm64.apk
          version="$(tr -d '[:space:]' < deepink/VERSION)"     # e.g. beta-3
          number="${version#beta-}"
          tag="deep-ink-${version}"
          title="Deep Ink Beta ${number}"
          # Release notes: the matching section of deepink/CHANGELOG.md.
          awk -v hdr="## Beta ${number} " 'index($0, hdr) == 1 {on=1; next} /^## / {on=0} on' deepink/CHANGELOG.md > notes.md
          printf '\n---\n**deep-ink-arm.apk**: celulares antigos / 32 bits (ex.: LG F100, F200, F300). **deep-ink-arm64.apk**: celulares modernos. Android 4.3+.\n\nBuild: %s\n' "${GITHUB_SHA::7}" >> notes.md
          cat notes.md
          if gh release view "${tag}" >/dev/null 2>&1; then
            # Same version rebuilt: refresh its APKs and notes, keep the release.
            gh release upload "${tag}" deep-ink-arm.apk deep-ink-arm64.apk --clobber
            gh release edit "${tag}" --title "${title}" --notes-file notes.md --prerelease
          else
            gh release create "${tag}" --prerelease --target "${GITHUB_SHA}" \
              --title "${title}" --notes-file notes.md \
              deep-ink-arm.apk deep-ink-arm64.apk
          fi
          # The old single "test" release is replaced by numbered betas.
          gh release delete deep-ink-test --yes --cleanup-tag || true
