# This workflow is managed by gh actions-lock.

name: Push / PR

permissions:
  contents: read

# Deep Ink: the full upstream matrix (every platform) only runs on demand.
# Android APKs are built by deep_ink_apk.yml.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # FIXME: only on PRs?
  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml

  build:
    name: Build
    needs: lint
    uses: $/.github/workflows/build.yml
    with:
      jobs: ${{ github.event_name }}
      ffi_cdecls_check: true
      tests: true
